<style>
  :root {
    --bg: #f0f7f0;
    --bg2: #ffffff;
    --bg3: #e8f2e8;
    --accent: #2e7d32;
    --text: #1a2e1a;
    --text2: #5a7a5a;
    --text3: #9ab89a;
    --border: #d0e8d0;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overscroll-behavior:none; }

  /* HEADER */
  .header { background:#e8f4e8; padding:12px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:10px; }
  .back-btn { width:32px; height:32px; border-radius:50%; background:var(--bg3); border:none; color:var(--text2); font-size:18px; cursor:pointer; display:none; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s; }
  .back-btn.visible { display:flex; }
  .back-btn:active { background:#333; }
  .logo-img { width:32px; height:32px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .logo-fallback { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#4caf50,#2e7d32); display:none; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .header-title { flex:1; }
  .logo-name { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:800; }
  .header-subtitle { font-size:10px; color:var(--text2); }

  /* SEARCH — видима тільки в списку товарів */
  .search-wrap { padding:10px 14px; background:#e8f4e8; border-bottom:1px solid var(--border); display:none; position:relative; z-index:10; }
  .search-wrap.visible { display:block; }
  .search-input { width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px 9px 34px; color:var(--text); font-size:14px; font-family:'Inter',sans-serif; outline:none; transition:border-color .2s; box-shadow:0 1px 3px rgba(0,80,0,0.08); }
  .search-input::placeholder { color:var(--text2); }
  .search-input:focus { border-color:var(--accent); }
  .search-icon { position:absolute; left:24px; top:50%; transform:translateY(-50%); color:var(--text2); font-size:14px; pointer-events:none; }
  .search-rel { position:relative; }

  /* DISCOUNT */
  .discount-banner { background:linear-gradient(90deg,#c8e6c9,#dcedc8); border-bottom:1px solid #a5d6a7; padding:8px 14px; font-size:12px; color:#2e7d32; line-height:1.4; }
  .discount-banner strong { color:#1b5e20; }

  /* ══ ЕКРАН 1: КАТЕГОРІЇ ══ */
  .screen { display:none; }
  .screen.active { display:block; }

    .cat-list { padding:8px 0; }
  .cat-row {
    display:flex; align-items:center; gap:16px;
    padding:18px 16px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    cursor:pointer; transition:background .12s;
  }
  .cat-row:active { background:var(--bg3); }
  .cat-icon-wrap {
    width:56px; height:56px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .cat-info { flex:1; }
  .cat-row-name { font-family:'Unbounded',sans-serif; font-size:15px; font-weight:700; color:var(--text); margin-bottom:4px; line-height:1.2; }
  .cat-row-count { font-size:13px; color:var(--text2); }
  .cat-row-arrow { font-size:22px; color:var(--text3); font-weight:300; }

  /* ══ ЕКРАН 2: ТОВАРИ ══ */
  .products-screen { padding-bottom:80px; }

  .cat-title-bar { padding:12px 14px 8px; display:flex; align-items:center; gap:8px; background:#e8f4e8; border-bottom:1px solid var(--border); position:relative; z-index:5; }
  .cat-title-icon { font-size:18px; }
  .cat-title-text { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; flex:1; }
  .cat-title-count { font-size:11px; color:var(--text2); }

  /* BRAND HEADER */
  .brand-header { padding:10px 14px 4px; display:flex; align-items:center; gap:8px; background:#f0f7f0; }
  .brand-name { font-family:'Unbounded',sans-serif; font-size:10px; font-weight:700; color:#5a8a5a; letter-spacing:1px; text-transform:uppercase; }
  .brand-line { flex:1; height:1px; background:var(--border); }
  .brand-count { font-size:10px; color:var(--text3); }

  /* PRODUCT ROW */
  .product-row { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; }
  .product-row:active { background:#e8f4e8; }
  .product-img-wrap { width:64px; height:64px; border-radius:var(--radius-sm); overflow:hidden; background:#f5f9f5; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); }
  .product-img { width:100%; height:100%; object-fit:contain; padding:4px; }
  .product-img-placeholder { font-size:26px; }
  /* Skeleton поки фото не завантажилось */
  .img-skeleton { width:100%; height:100%; background:linear-gradient(90deg,#222 25%,#2a2a2a 50%,#222 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  .product-info { flex:1; min-width:0; }
  .product-name { font-size:13px; font-weight:600; line-height:1.3; margin-bottom:5px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .product-tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .tag { font-size:10px; padding:2px 7px; border-radius:100px; background:#e8f5e9; color:#388e3c; border:1px solid #c8e6c9; white-space:nowrap; }
  .price-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .price { font-family:'Unbounded',sans-serif; font-size:14px; font-weight:700; color:var(--accent); }
  .price-unit { font-size:11px; color:var(--text2); }
  .stock-in { font-size:10px; padding:2px 7px; border-radius:100px; background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7; font-weight:600; }
  .stock-order { font-size:10px; padding:2px 7px; border-radius:100px; background:#e3f2fd; color:#1565c0; border:1px solid #90caf9; font-weight:600; }
  .stock-wait { font-size:10px; padding:2px 7px; border-radius:100px; background:#fff8e1; color:#f57f17; border:1px solid #ffe082; font-weight:600; }
  .product-arrow { color:var(--text3); font-size:18px; flex-shrink:0; }

  /* LOADER */
  .loader { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 0; gap:14px; }
  .loader-ring { width:32px; height:32px; border:3px solid #c8e6c9; border-top-color:#2e7d32; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loader-text { color:var(--text2); font-size:13px; }

  .empty { text-align:center; padding:50px 20px; color:var(--text2); }
  .empty-icon { font-size:36px; margin-bottom:10px; }
  .error-banner { background:#2a1a1a; border:1px solid #5a2020; border-radius:var(--radius-sm); padding:12px 14px; font-size:13px; color:#ff8080; margin:14px; line-height:1.5; }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:200; align-items:flex-end; justify-content:center; }
  .modal-overlay.open { display:flex; animation:fadeIn .2s ease; }
  @keyframes fadeIn { from{opacity:0}to{opacity:1} }
  .modal { background:#fff; border-radius:var(--radius) var(--radius) 0 0; width:100%; max-width:600px; max-height:88vh; overflow-y:auto; animation:slideUp .22s ease; border-top:1px solid var(--border); }
  @keyframes slideUp { from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1} }
  .modal-handle { width:34px; height:4px; background:var(--border); border-radius:2px; margin:10px auto 0; }
  .modal-img-wrap { width:100%; background:#f5f9f5; display:flex; align-items:center; justify-content:center; padding:20px; min-height:160px; }
  .modal-img { max-width:100%; max-height:200px; object-fit:contain; }
  .modal-img-placeholder { font-size:64px; }
  .modal-body { padding:14px 16px 28px; }
  .modal-brand { font-size:10px; color:var(--accent); font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
  .modal-name { font-family:'Unbounded',sans-serif; font-size:15px; font-weight:700; line-height:1.3; margin-bottom:10px; }
  .modal-tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:14px; }
  .modal-price { font-family:'Unbounded',sans-serif; font-size:22px; color:var(--accent); font-weight:700; margin-bottom:14px; }
  .modal-discount { background:#e8f5e9; border:1px solid #a5d6a7; border-radius:6px; padding:9px 11px; font-size:12px; color:#2e7d32; line-height:1.5; margin-bottom:16px; }
  .modal-btn { display:block; width:100%; padding:14px; background:var(--accent); color:#fff; font-family:'Unbounded',sans-serif; font-size:12px; font-weight:700; border:none; border-radius:var(--radius); cursor:pointer; text-align:center; transition:opacity .15s; text-decoration:none; }
  .modal-btn:active { opacity:.85; }

  /* Page transition */
  .screen { animation:pageFade .2s ease; }
  @keyframes pageFade { from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)} }
</style>
</head>

// ── PARSE ──
function parseCSV(text){
  const lines=text.trim().split("\n");
  if(lines.length<2)return[];
  const headers=lines[0].split(",").map(h=>h.replace(/"/g,"").trim().toLowerCase());
  return lines.slice(1).map(line=>{
    const vals=[];let cur="",inQ=false;
    for(const c of line){if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){vals.push(cur.trim());cur="";}else cur+=c;}
    vals.push(cur.trim());
    const obj={};headers.forEach((h,i)=>obj[h]=(vals[i]||"").replace(/^"|"$/g,"").trim());
    return obj;
  });
}
const CAT_RENAME = {"Витратні матеріали":"Кабелі","Сонячний кабель":"Кабелі"};
function norm(r){
  const desc=r.description||r["опис"]||"";
  const bf=desc.includes("·")?desc.split("·")[0].trim():"";
  return {
    category:CAT_RENAME[r.category||r["категорія"]||"Інші товари"]||(r.category||r["категорія"]||"Інші товари"),
    brand:r.brand||r["бренд"]||bf||"—",
    name:r.name||r["назва"]||"",
    price:r.price||r["ціна"]||"",
    unit:r.unit||r["одиниця"]||"грн",
    photo:r.photo_url||r["фото"]||"",
    desc:desc,
    stock:r.stock||r["залишок"]||"",
  };
}

let all=[], activeCat="", searchQ="";

// ── LOAD ──
async function loadData(){
  try{
    const res=await fetch(CONFIG.SHEET_URL+"&t="+Date.now());

    all=parseCSV(await res.text()).map(norm).filter(p=>p.name);

      <!-- Solar panel on roof -->
      <rect x="18" y="14" width="6" height="4" rx="0.5" fill="#4caf50" opacity="0.8"/>

      <!-- Lightning bolt -->
      <path d="M26 24 L22 31 L25 31 L22 38 L30 29 L26 29 Z" fill="#ffb74d" stroke="#ff8f00" stroke-width="0.5"/>

  "Інші товари": { bg:"#1a1a20", svg:`
    <svg viewBox="0 0 48 48" width="32" height="32" fill="none">
      <rect x="6" y="4" width="36" height="22" rx="5" fill="#d0d0d0"/>
      <rect x="8" y="6" width="22" height="12" rx="2" fill="#050505"/>
      <text x="19" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#f44336" font-weight="bold">220</text>
      <circle cx="36" cy="10" r="3" fill="#4caf50"/>
      <rect x="30" y="7" width="8" height="5" rx="1.5" fill="#b0b0b0" stroke="#999" stroke-width="0.5"/>
      <rect x="30" y="14" width="8" height="5" rx="1.5" fill="#b0b0b0" stroke="#999" stroke-width="0.5"/>
      <circle cx="24" cy="36" r="11" fill="#c8c8c8"/>
      <circle cx="24" cy="36" r="9" fill="#d0d0d0"/>
      <circle cx="20" cy="38" r="2.5" fill="#2a2a2a"/>
      <circle cx="28" cy="38" r="2.5" fill="#2a2a2a"/>
      <rect x="21" y="29" width="6" height="5" rx="1.5" fill="#2a2a2a"/>
      <rect x="14" y="33" width="4" height="3" rx="1" fill="#aaa"/>

};
function getCatIcon(cat) {
  return CAT_ICONS[cat] || CAT_ICONS['Інші товари'] || { bg:"#1a1a2a", color:"#90a4ae",
    svg:`<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><rect x="4" y="4" width="18" height="18" rx="3" stroke="#90a4ae" stroke-width="1.8"/></svg>`};
}

function buildCats(){
  const cats=[...new Set(all.map(p=>p.category))];
  const grid=document.getElementById("catGrid");
  grid.innerHTML="";
  cats.forEach(cat=>{
    const count=all.filter(p=>p.category===cat).length;
    const icon=getCatIcon(cat);
    const row=document.createElement("div");
    row.className="cat-row";
    row.innerHTML=`
      <div class="cat-icon-wrap" style="background:${icon.bg};display:flex;align-items:center;justify-content:center">${icon.svg}</div>
      <div class="cat-info">
        <div class="cat-row-name">${cat}</div>
        <div class="cat-row-count">${count} позицій</div>
      </div>
      <div class="cat-row-arrow">›</div>`;
    row.onclick=()=>openCat(cat);
    grid.appendChild(row);
  });
}

// ── OPEN CATEGORY ──
function openCat(cat){
  const ph=document.getElementById('headerPhone'); if(ph) ph.style.display='none';
  activeCat=cat;
  searchQ="";
  document.getElementById("searchInput").value="";

  // Switch screens
  document.getElementById("screenCats").classList.remove("active");
  document.getElementById("screenProducts").classList.add("active");
  document.getElementById("backBtn").classList.add("visible");
  document.getElementById("searchWrap").classList.add("visible");
  document.getElementById("headerTitle").textContent=cat;
  document.getElementById("headerSub").textContent=`${ce(cat)} ${all.filter(p=>p.category===cat).length} позицій`;

  renderProducts();
}

// ── BACK ──
function goBack(){
  const ph=document.getElementById('headerPhone'); if(ph) ph.style.display='flex';
  document.getElementById("screenProducts").classList.remove("active");
  document.getElementById("screenCats").classList.add("active");
  document.getElementById("backBtn").classList.remove("visible");
  document.getElementById("searchWrap").classList.remove("visible");
  document.getElementById("headerTitle").textContent="AVTONOMKA";
  document.getElementById("headerSub").textContent="АВТОНОМНА ЕНЕРГЕТИКА";
  activeCat=""; searchQ="";
}

document.getElementById("searchInput").addEventListener("input",e=>{searchQ=e.target.value.toLowerCase();renderProducts();});

// ── RENDER PRODUCTS ──
function renderProducts(){
  let items=all.filter(p=>p.category===activeCat);
  if(searchQ)items=items.filter(p=>p.name.toLowerCase().includes(searchQ)||p.brand.toLowerCase().includes(searchQ)||p.desc.toLowerCase().includes(searchQ));

  const el=document.getElementById("productsContent");
  el.innerHTML="";

  if(!items.length){el.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div>Нічого не знайдено</div></div>`;return;}

  // Title bar
  const tb=document.createElement("div"); tb.className="cat-title-bar";
  tb.innerHTML=`<span class="cat-title-icon">${ce(activeCat)}</span><span class="cat-title-text">${activeCat}</span><span class="cat-title-count">${items.length} поз.</span>`;
  el.appendChild(tb);

  // Group by brand
  const byBrand=groupBy(items,"brand");
  const multi=Object.keys(byBrand).length>1;

  // For "Автономне енергоживлення" sort by numeric power value
  const brandKeys = Object.keys(byBrand);
  if(activeCat==="Комплекти автономного енергоживлення"){
    brandKeys.sort((a,b)=>{
      const pa=parseFloat(a.replace(",",".").replace("кВт","").trim())||999;
      const pb=parseFloat(b.replace(",",".").replace("кВт","").trim())||999;
      return pa-pb;
    });
  }

  for(const brand of brandKeys){ const bItems=byBrand[brand];
    if(multi&&brand!=="—"){
      const bh=document.createElement("div"); bh.className="brand-header";
      bh.innerHTML=`<div class="brand-name">${brand}</div><div class="brand-line"></div><div class="brand-count">${bItems.length} шт</div>`;
      el.appendChild(bh);
    }
    bItems.forEach(p=>{
      const row=document.createElement("div"); row.className="product-row";
      row.onclick=()=>openModal(p);
      const tags=getTags(p);
      const stockHTML=getStockBadge(p);

      // Skeleton + lazy image
      const imgHTML=p.photo
        ?`<div class="img-skeleton" id="sk_${p.name.replace(/\W/g,'')}"></div>`
        :`<div class="product-img-placeholder">${ce(p.category)}</div>`;

      row.innerHTML=`
        <div class="product-img-wrap" id="wrap_${p.name.replace(/\W/g,'')}">${imgHTML}</div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          ${tags.length?`<div class="product-tags">${tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`:""}
          <div class="price-row">
            ${p.price?`<span class="price">${fmt(p.price)}</span><span class="price-unit">${p.unit}</span>`:""}
            ${stockHTML}
          </div>
        </div>
        <div class="product-arrow">›</div>`;
      el.appendChild(row);

      // True lazy load — завантажуємо тільки коли елемент видно
      if(p.photo){
        const wrapId=`wrap_${p.name.replace(/\W/g,'')}`;
        row.dataset.photo=p.photo;
        row.dataset.wrapId=wrapId;
        row.dataset.photoAlt=p.name;
        row.dataset.photoCat=p.category;
        lazyQueue.push(row);
      }
    });
  }
  // Start observing newly added rows
  requestAnimationFrame(initLazyObserver);
}

function getStockBadge(p){
  const s=(p.stock||"").toLowerCase().trim();
  if(s.includes("під замовлення")) return `<span class="stock-order">📦 Під замовлення</span>`;
  if(s.includes("очікується")||s.includes("очікуються")||s.includes("передзамовлен")) return `<span class="stock-wait">⏳ Очікується</span>`;
  const d=(p.desc||"").toLowerCase();
  if(d.includes("очікуються")||d.includes("передзамовлен")) return `<span class="stock-wait">⏳ Очікується</span>`;
  return `<span class="stock-in">✓ В наявності</span>`;
}
function getStockNote(p){
  const s=(p.stock||"").toLowerCase().trim();
  if(s.includes("під замовлення")) return `<div style="font-size:12px;color:#1565c0;margin-bottom:12px">📦 Товар під замовлення — уточніть терміни у менеджера</div>`;
  if(s.includes("очікується")||s.includes("очікуються")) return `<div style="font-size:12px;color:#f57f17;margin-bottom:12px">⏳ Очікується надходження</div>`;
  return "";
}
function getTags(p){
  if(p.desc.includes("·"))return p.desc.split("·").slice(1).map(s=>s.trim()).filter(Boolean);
  return[];
}
function groupBy(arr,key){return arr.reduce((acc,i)=>{const k=i[key]||"—";if(!acc[k])acc[k]=[];acc[k].push(i);return acc;},{});}
function fmt(p){const n=parseFloat(String(p).replace(/\s/g,"").replace(",","."));return isNaN(n)?p:n.toLocaleString("uk-UA");}

// ── MODAL ──
function openModal(p){
  const tags=getTags(p);
  const stockNote=getStockNote(p);
  document.getElementById("modalContent").innerHTML=`
    <div class="modal-img-wrap">
      ${p.photo?`<img class="modal-img" src="${p.photo}" alt="${p.name}" loading="lazy">`:`<div class="modal-img-placeholder">${ce(p.category)}</div>`}
    </div>
    <div class="modal-body">
      <div class="modal-brand">${p.brand} · ${p.category}</div>
      <div class="modal-name">${p.name}</div>
      ${tags.length?`<div class="modal-tags">${tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`:""}
      ${p.price?`<div class="modal-price">${fmt(p.price)} <span style="font-size:14px;color:var(--text2);font-family:Inter,sans-serif;font-weight:400">${p.unit}</span></div>`:""}
      ${stockNote}
      <div class="modal-discount">💚 <strong>Інсталяторам та гуртовим покупцям</strong> — спеціальна ціна. Зв'яжіться з менеджером.</div>
      <a class="modal-btn" href="${CONFIG.MANAGER}?text=${encodeURIComponent("Цікавить: "+p.name)}" target="_blank">Замовити</a>
    </div>`;
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(e){
  if(e.target===document.getElementById("modalOverlay")){
    document.getElementById("modalOverlay").classList.remove("open");
    document.body.style.overflow="";
  }
}

// ── TRUE LAZY LOAD ──
const lazyQueue = [];
let observer;

function initLazyObserver(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      const row = entry.target;
      const photo = row.dataset.photo;
      const wrapId = row.dataset.wrapId;
      const alt = row.dataset.photoAlt;
      const cat = row.dataset.photoCat;
      if(!photo || !wrapId) return;
      observer.unobserve(row);
      const img = new Image();
      img.onload=()=>{
        const wrap=document.getElementById(wrapId);
        if(wrap) wrap.innerHTML=`<img class="product-img" src="${photo}" alt="${alt}">`;
      };
      img.onerror=()=>{
        const wrap=document.getElementById(wrapId);
        if(wrap) wrap.innerHTML=`<div class="product-img-placeholder">${ce(cat)}</div>`;
      };
      img.src=photo;
    });
  },{rootMargin:"200px 0px", threshold:0});
  lazyQueue.forEach(row=>{ if(row.isConnected) observer.observe(row); });
  lazyQueue.length=0;
}

// Call after each render
loadData();
</script>
